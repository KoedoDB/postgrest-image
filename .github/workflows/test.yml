name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgREST against PostgreSQL 18 (tokens, roles, row level security, limits, key rotation)
        run: tests/run.sh
